name: qwen-mtp-ranked-benchmark

# QWEN 3.8 NATIVE-MTP SPECULATIVE-DECODE TRACK (track id qwen3.8-27b-mtp-v1).
#
# STATUS: NOT LIVE. INERT AND FAIL-CLOSED, PENDING THE 3.8 BRING-UP.
#
# HISTORY. This file served the QWEN 3.6 track (qwen3.6-27b-mtp-v1), which went
# live 2026-08-13 on the qwen36-mtp-track ref of Layr-Labs/mlxfast-challenge-dev
# and moved to main of Layr-Labs/qwen-3.6-mtp-challenge-dev at the 2026-08-13
# repo split, where the TEMPORARY qwen36-mtp-track arm of the ref allowlist was
# removed. Both of those sentences are provenance and are spelled as they
# happened. docs/qwen-mtp-go-live-runbook.md is likewise the record of the 3.6
# go-live: its ids, paths and measured numbers are 3.6-era throughout.
#
# WHERE IT STANDS NOW. The repository is being renamed to
# Layr-Labs/qwen-3.8-mtp-challenge and the track re-pinned onto Qwen 3.8
# 27B. This file carries the 3.8 SKELETON, not a runnable track. FIVE
# independent things refuse a dispatch today, and each has to be resolved by the
# operator with a real measured artifact:
#
#   1. MLXFAST_QWEN_MTP_TRUSTED_REPOSITORY names the post-rename slug, so every
#      dispatch is refused until the rename actually happens.
#   2. MLXFAST_QWEN_MTP_CALIBRATION_READY is back to "0", which refuses every
#      TIMED dispatch (NEW-MODEL-BRINGUP 7.5).
#   3. The contract fixture fixtures/qwen3_8_27b_mtp_track.json carries
#      official_scoring_enabled=false and
#      reference_baseline.publication_allowed=false, which refuses every RANKED
#      dispatch.
#   4. (RESOLVED 2026-08-14, both halves.) The backbone and the MTP head are
#      published, so both REVISIONS are real commit shas, both byte manifests
#      carry generated bodies, and all four manifest shape pins are integers
#      summed from those bodies. This clause used to name two pending markers
#      and is kept as the record of what closed; nothing below is gated on it
#      any more. The remaining refusals are 1-3 and 5.
#   5. Every hidden-artifact digest/byte pin and every hidden R2 object key
#      reads QWEN38-PENDING-RELEASE, so "Enforce Qwen-MTP organizer pin
#      completeness" exits 1 on EVERY dispatch, ranked or gates-only. The four
#      PUBLIC-golden pins are no longer in that set: the 3.8 goldens are checked
#      in and the pins are computed from their bytes, so a pending public pin is
#      MALFORMED again rather than tolerated.
#
# BACKBONE IDENTITY, 2026-08-14, SECOND DECISION OF THE DAY. The reference
# checkpoint is OUR OWN CONVERSION, published as EigenLabs/Qwen3.8-27B-4bit @
# eda45ab47f465d08d6558f0353a2346e2eb9d5b3, of the official bf16 base
# Qwen/Qwen3.8-27B @ 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0 under a pinned
# mlx 0.32.0 toolchain. The repository is decided AND the upload has landed, so
# the revision and every path that spells it carry the sha rather than a marker.
#
# WHAT THIS REPLACED, and why. Earlier the same day the track adopted a
# third-party personal-account conversion of the same bf16 base. That adoption
# was TERMINATED hours later by the operator's validation kill-switch: the
# deterministic reconversion cross-check the adoption had RESERVED was performed
# after all, and 994 of 1,847 tensors differ numerically from our own mlx-0.32.0
# conversion of the official bf16. A reference checkpoint whose bytes we cannot
# reproduce is not a reference. The termination is recorded in the contract
# fixture's target.upstream_source_note; the upstream bf16 base is UNCHANGED and
# is still the lineage every artifact on this track descends from.
#
# GEOMETRY IS UNDISTURBED. The 2026-08-14 geometry reading -- 64 layers on the
# same 4-layer hybrid repeat, vocab 248320, hidden 5120, 24 attention heads / 4
# KV heads, head_dim 256, byte-identical to 3.6 -- is a property of the bf16
# base and is inherited by any conversion of it. The cross-check that terminated
# the earlier adoption was NUMERICAL (tensor values), not structural, so every
# QWEN38-VERIFY-AT-RELEASE hedge that was about GEOMETRY stays discharged.
#
# TWO PENDING MARKERS, DOWN FROM FOUR. QWEN-MTP-PENDING-ORGANIZER is the 3.6-era
# marker and is RETAINED unweakened: it still means "an organizer artifact was
# never produced", and the public-fixture pins still may never carry it.
# QWEN38-PENDING-RELEASE means "this was a real, resolved 3.6 value that the
# model change invalidated", and it still covers every hidden and public
# artifact awaiting regeneration against the 3.8 tower.
#
# THE OTHER TWO ARE RETIRED, 2026-08-14, by the publishes they were minted for.
# One meant "the 3.8 MTP head exists but has not been published yet"; the other,
# added with the identity swap, meant the same thing about the backbone
# conversion. They were spelled separately -- never folded into
# QWEN38-PENDING-RELEASE -- precisely so that a reader could tell WHICH half of
# the checkpoint was missing while the two halves published independently. Both
# uploads landed, so both markers are deleted from this workflow, from the
# pin-completeness gate's is_pending helper and from every pin that carried
# them, in one commit: a marker no value can carry is documentation, not a
# tripwire, and leaving it defined would invite a future pin to reach for a
# pending state that no longer means anything. The gate still refuses every
# dispatch on the two markers that remain.
#
# QWEN38-VERIFY-AT-RELEASE still marks every value left at its 3.6 MEASUREMENT
# -- the timed pool, the calibration constants, the semantic GPQA floor --
# because guessing a 3.8 value would be worse than carrying a stale one behind
# a closed gate. Each must be re-derived, not merely re-read. It no longer marks
# any GEOMETRY value: those were verified. It no longer marks the HEAD'S TENSOR
# COUNT either: that was re-derived on 2026-08-14 and is 15 bf16 tensors, not
# the 31 the 3.6 head's 4-bit weight/scales/biases triples produced.
#
# NAMING. The obvious filename for this workflow would append "-benchmark"
# directly after "mtp-", which reproduces one of the retired Gemma/Laguna MTP
# surface names (DFlashGateTextSupport.retiredMTPNames) as a substring -- and the
# naming law forbids any of those strings anywhere in the repository. The name
# is therefore qwen-mtp-ranked-benchmark(.yml), with "ranked" breaking the
# adjacency; every artifact name this job publishes follows the same rule.
# QwenMTPTrackNamingTests enumerates every new surface name this track
# introduces and proves the property mechanically, so a future rename cannot
# silently reintroduce a retired string. The suffix rule is the whole trick:
# prefixing a retired name with "qwen-" does NOT make it new.
#
# RELATIONSHIP TO THE LIVE TRACK. The ranked track on main is
# laguna-xs-2.1-dflash-v1 (.github/workflows/dflash-benchmark.yml,
# benchmark.json). This workflow is modeled structurally on that one -- same
# step order, same trusted-shell sealing, same single-occupancy hidden-golden
# bracket, same TOCTOU harness pins -- and it CHANGES NOTHING about it. Both may
# coexist on this branch; only one may ever be the ranked entrypoint, and the
# switch is a repo-split action, not a change here.
#
# METHOD. The speculative mechanism is the CHECKPOINT'S OWN multi-token-
# prediction head (mlx-community/Qwen3.6-27B-MTP-4bit, ~247 MB), not a separately
# trained EAGLE-style drafter. That is the one structural difference from the
# DFlash template: there is no third-party drafter artifact to substitute, so
# the anti-substitution rules bind the MTP head's pinned revision instead.
# Measured envelope on M5 (depth 2, exact-greedy vs serial, 12/12 runs to 512
# tokens): 1.74x @ 32 tokens, 1.34x @ 128, ~1.0x @ 512. Depth 3 is exact but
# net-slower. Depth is pinned at 2 below and MUST be re-derived across the whole
# timed pool once the pool exists, exactly as DFlash re-derived K three times.
#
# SCORING (operator-ratified 2026-08-14 -- SERIAL = 1.0; supersedes the
# per-prompt normalised aggregation of 2026-08-13; see
# docs/qwen-mtp-go-live-runbook.md and the contract fixture's
# scoring_semantics block):
#   per prompt p, over that prompt's accepted thermally-gated pairs:
#     raw_p = mean(serial depth-0 seconds/token) / mean(MTP seconds/token)
#   score   = median(raw_p over ALL 8 pool prompts)
# The median rule is the mean of the two central order statistics -- 8 is even,
# so the tie-break is load-bearing and is NOT the lower-median rule used by the
# per-pair diagnostics. There is no normalisation step left in the scoring path.
#
# WHY THE ANCHOR MOVED. Dividing by each prompt's pinned no-op reference made an
# UNMODIFIED candidate score exactly 1.0 by construction, which declared the
# shipped depth-2 speculative decoder to be the zero point. It is not: measured
# on box 3 it is a ~6.5% regression against true serial at this window (raw
# median 0.935). Anchoring at serial makes 1.0 mean serial decode, and it is
# also what makes the whole speculative apparatus safely editable -- a candidate
# that drafts nothing degenerates to serial and scores 1.0, so turning
# speculation off is an honest submission rather than an exploit. The pool's
# no-op references stay pinned in the contract as informational diagnostics.
#
# FLOOR AND CEILING. 0.95 on the raw median is a measurement-validity floor, not
# a quality bar. 5.0 is the plausibility ceiling the published aggregate used to
# lack entirely (k-matrix finding 3): the box wrapper bounded per-pair ratios and
# nothing bounded the number that reached the leaderboard.
#
# HOST CONTRACT (operator-provisioned, janitor-audited; consumed, never
# installed, by this workflow):
#   MLXFAST_QWEN_MTP_TARGET_DIR   read-only runner-owned cache holding exactly
#                                 the 15 files pinned by
#                                 fixtures/reference_qwen3_8_27b_4bit.sha256.
#   MLXFAST_QWEN_MTP_HEAD_DIR     read-only cache holding the pinned MTP head
#                                 (its byte manifest is PENDING -- phase 2).
#   MLXFAST_QWEN_MTP_BASELINE_WS  pinned prebuilt tree with weights already
#                                 transformed; the serial denominator runs from
#                                 here, never from the candidate workspace.
#   MLXFAST_QWEN_MTP_BASELINE_CALIBRATION
#                                 operator calibration with sanity bands.
#   MLXFAST_QWEN_MTP_MEASURE_JOB  box-owned timing wrapper measure-qwen-mtp-job.sh
#                                 (fixed 40C thermal contract, 2 Hz macmon
#                                 telemetry, throttle/stall rejection, per-track
#                                 state isolation, lib-only hook).
#
# Dispatch-only, same self-hosted safety rules as the DFlash pipeline: no
# PR/push triggers, refs restricted to main, submissions/*, baseline/*, and
# yukon/baseline/*.
on:
  workflow_dispatch:
    inputs:
      confirm_track_enabled:
        description: "ARMING interlock. Defaults TRUE so Yukon (which omits custom inputs) can dispatch; the load-bearing gates are the trusted contract fields, the calibration-ready interlock, and the organizer pin-completeness gate, none of which this flag can satisfy. An explicit false is still refused."
        required: false
        default: true
        type: boolean
      run_benchmark:
        description: "Run the timed paired MTP measurement after the correctness/parity gate. false = correctness/parity only (the migration-window shape: gates work while ranked timing stays refused)."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mlxfast-qwen-mtp-ranked-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  qwen-mtp-ranked:
    name: "single-machine Qwen 3.8 MTP ranked benchmark (m5-qwen38-27b-mtp)"
    # DEDICATED label, deliberately NOT m5-bench and NOT m5-laguna-dflash.
    # An unserved dispatch QUEUES instead of running on a box provisioned for
    # another track, which is the safe failure for an inert track. Registering a
    # runner under this label is an operator action (target box: m5-max-128gb-3).
    # QWEN38-VERIFY-AT-RELEASE. The runner label is a physical property of box
    # 3, set by the operator's supervisor config, and is deliberately NOT
    # renamed here: this repository cannot assert a label into existence, and
    # either spelling is fail-closed (a job whose label the box does not carry
    # is never picked up). Move it together with the ("runner label", ...) entry
    # in QwenMTPTrackNamingTests.newSurfaceNames and its
    # theEnumeratedNamesAreTheOnesTheFilesUse pin, once the box is relabelled.
    runs-on: [self-hosted, m5-qwen38-27b-mtp]
    # Budget: build (~15m) + transform of the 16.1 GB source (~10m) + artifact
    # hashing (~3m) + full-length parity pass (~15m) + cooldowns (up to 900s per
    # timed phase) + >=3 alternating timed pairs.
    timeout-minutes: 360
    # MUST match the environment the other ranked jobs bind: the SAME secret
    # NAMES resolve per environment, so a different binding silently hands this
    # job different credentials and a different endpoint for the same objects.
    environment: benchmark-private-prompts-v2
    env:
      # --- Host contract -------------------------------------------------
      MLXFAST_BENCH_EXEC: /opt/bench/bench-exec.sh
      MLXFAST_JANITOR: /opt/bench/janitor.sh
      MLXFAST_QUARANTINE_FLAG: /opt/bench/quarantine.flag
      MLXFAST_MACMON: /opt/bench-runner/bin/macmon
      MLXFAST_QWEN_MTP_MEASURE_JOB: /opt/bench-runner/measure-qwen-mtp-job.sh
      # Per-track paths. The calibration file MUST stay inside the per-track
      # state dir: the bare /opt/bench-runner/state is the retired serial
      # track's, and banding this track's runs against those numbers would
      # cross-write another track's oracle cache.
      MLXFAST_QWEN_MTP_BASELINE_WS: /opt/bench-runner/baseline/qwen3.8-27b-mtp-v1/current
      MLXFAST_QWEN_MTP_BASELINE_CALIBRATION: /opt/bench-runner/state/qwen3.8-27b-mtp-v1/baseline-calibration.json
      MLXFAST_MEASURE_STATE_DIR: /opt/bench-runner/state/qwen3.8-27b-mtp-v1
      # Pinned checkpoint snapshot. The 3.8 backbone reference is OUR OWN
      # conversion of the official bf16 base Qwen/Qwen3.8-27B @
      # 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0, produced under a pinned
      # toolchain (mlx 0.32.0) and published as EigenLabs/Qwen3.8-27B-4bit. MLX
      # 4-bit affine / group_size 64: the `quantization` and
      # `quantization_config` blocks are exactly
      # {"group_size": 64, "bits": 4, "mode": "affine"} and equal to each other
      # -- the same envelope the 3.6 target shipped, which is why the
      # quantization contract in fixtures/qwen3_8_27b_mtp_track.json is carried
      # unchanged rather than re-negotiated. The tower is text-only: 1,847
      # tensors, ALL under `language_model.` and NONE under `mtp.` (the head
      # ships separately, as it did on 3.6).
      #
      # WHY THIS IS OURS AND NOT THE ARTIFACT ADOPTED EARLIER THE SAME DAY. The
      # personal-account conversion this track adopted hours before was
      # TERMINATED by the operator's validation kill-switch. The deterministic
      # reconversion cross-check that adoption had RESERVED was performed: 994
      # of 1,847 tensors differ numerically from our own mlx-0.32.0 conversion
      # of the official bf16. The termination is recorded once, in the contract
      # fixture's target.upstream_source_note; every other site simply names the
      # replacement. The upstream bf16 base is unchanged and still correct.
      #
      # THE REVISION IS PUBLISHED, 2026-08-14:
      # eda45ab47f465d08d6558f0353a2346e2eb9d5b3. It carried a pending marker
      # from the identity swap until the upload landed, because a marker fails
      # the pin-completeness gate by NAME while a placeholder-shaped hex string
      # would have failed later and read as a bad download.
      #
      # The snapshot leaf must BE the revision ("Qwen-MTP host preflight"
      # asserts it), so the revision is spelled in both places and they stay
      # equal. MLXFAST_REFERENCE_DIR further below is the THIRD spelling of this
      # same directory and the preflight asserts it byte-identical -- resolve
      # the three together or not at all, which is how they moved off the
      # marker.
      #
      # THE REPOSITORY IS PRIVATE. Staging it on box 3 needs a Hugging Face
      # token with read access; an unauthenticated snapshot_download 401s.
      #
      # MIRRORED: Sources/MLXFastCore/Constants.swift
      # (referenceModelRepository / referenceModelRevision / referenceModelName
      # / defaultReferencePath / defaultReferenceCachePath) and setup.sh carry
      # these same values. Read the constant's own doc comment before touching
      # either: the checked-in public correctness goldens still carry 3.6
      # provenance and Golden.swift rejects them against the repinned constants,
      # which is deliberate and fail-closed but is a REAL consequence.
      #
      # ALSO RESOLVED on this artifact in the same commit: the per-file byte
      # manifest. See MLXFAST_QWEN_MTP_TARGET_MANIFEST_RECORDS / _BYTES below.
      MLXFAST_QWEN_MTP_TARGET_DIR: /opt/bench-runner/cache/huggingface/hub/models--EigenLabs--Qwen3.8-27B-4bit/snapshots/eda45ab47f465d08d6558f0353a2346e2eb9d5b3
      MLXFAST_QWEN_MTP_CHECKPOINT_REPO: EigenLabs/Qwen3.8-27B-4bit
      MLXFAST_QWEN_MTP_CHECKPOINT_REVISION: eda45ab47f465d08d6558f0353a2346e2eb9d5b3
      # The MTP head is a SEPARATELY pinned artifact and is NOT part of the
      # backbone manifest (the pinned backbone revision contains no mtp.* tensors
      # and the transform never selects them).
      #
      # PUBLISHED 2026-08-14: EigenLabs/Qwen3.8-27B-MTP-bf16 @
      # 26a328e070875b0314d652a039b6b59902690f03, extracted from the official
      # bf16 base Qwen/Qwen3.8-27B @ 1d4bf0f2. The artifact is 15 bf16 tensors,
      # 849,398,784 tensor bytes, in a single model.safetensors of 849,400,347
      # bytes.
      #
      # THE PUBLISHED TREE IS FOUR FILES, and the LOADER is why. The first
      # publish (5419d386) carried only model.safetensors plus the
      # `.gitattributes` Hugging Face generates for every repository, on the
      # reasoning that the head merges into the target's tree under the `mtp.`
      # prefix at load and carries no independent tokenizer. That is still true
      # of the TOKENIZER and was wrong about the rest:
      # Qwen36MTPHeadAttachment.verifyHeadTree requires
      # `model.safetensors.index.json` and `config.json` in the head directory
      # and refuses the load without them -- the index to assert 15 BARE tensor
      # names (a pre-merged `mtp.`-prefixed tree is refused, not accommodated),
      # the config to assert the same architecture family and the single MTP
      # layer `mtp_num_hidden_layers: 1` promises. So the head repository was
      # republished at 26a328e0 with those two files added, and the manifest and
      # shape pins below moved with it. Still no tokenizer files. The head's
      # revision and manifest shape kept their own pending marker (never the
      # backbone's) so a reader could tell WHICH half of the checkpoint was
      # unpublished; both halves are published now and both markers are retired.
      #
      # The backbone snapshot carries ZERO mtp.* tensors, so the head
      # remains a separately pinned artifact on 3.8 exactly as on 3.6. The head
      # DIRECTORY is a per-track path derived from the track id, and the
      # operator stages the two published files into it; verify_cache below
      # requires that directory to match this manifest file-for-file.
      #
      # THE HEAD REPOSITORY IS PRIVATE, like the backbone: staging it needs a
      # Hugging Face token with read access.
      MLXFAST_QWEN_MTP_HEAD_DIR: /opt/bench-runner/cache/qwen38/qwen3.8-27b-mtp-v1/mtp-head
      MLXFAST_QWEN_MTP_HEAD_REPO: EigenLabs/Qwen3.8-27B-MTP-bf16
      MLXFAST_QWEN_MTP_HEAD_REVISION: 26a328e070875b0314d652a039b6b59902690f03
      # Bench workspace: distinct stable path per track, same
      # /Users/Shared/bench-jobs confinement contract. Stable across runs on
      # purpose (llbuild caches absolute paths); never per-run.
      MLXFAST_JOB_WS: /Users/Shared/bench-jobs/qwen-mtp-ranked-current
      # --- Runner-only private material (0700 runner) --------------------
      MLXFAST_PRIVATE_DIR: /tmp/mlxfast-qwen-mtp-private-${{ github.run_id }}-${{ github.run_attempt }}
      # Satisfies stage-benchmark-artifacts.sh's /tmp/mlxfast-artifacts- prefix
      # contract with a track-distinct run component.
      MLXFAST_ARTIFACT_ROOT: /tmp/mlxfast-artifacts-qwen-mtp-${{ github.run_id }}-${{ github.run_attempt }}
      MLXFAST_MEASURE_OUT: /tmp/mlxfast-qwen-mtp-measure-${{ github.run_id }}-${{ github.run_attempt }}
      # --- Track contract ------------------------------------------------
      MLXFAST_QWEN_MTP_TRACK_ID: qwen3.8-27b-mtp-v1
      MLXFAST_QWEN_MTP_TRACK_NAME: mlxfast-challenge-dev-qwen38-mtp
      # The track contract fixture. "Enforce Qwen-MTP track enablement" does
      # `test -s` on this path, and then refuses a RANKED dispatch while either
      # official_scoring_enabled or reference_baseline.publication_allowed is
      # false. Both were flipped BACK to false for the 3.8 cutover, so ranked
      # runs are refused and only run_benchmark=false gates-only dry runs would
      # proceed -- and those are refused too, by the pending pins below.
      #
      # QWEN38-VERIFY-AT-RELEASE: the fixture's timed_prompt_pool, its per-entry
      # no-op references and its calibration block are all 3.6 MEASUREMENTS
      # carried across unchanged. They are not 3.8 numbers and nothing may score
      # against them; they are retained rather than blanked because the suite
      # derives real invariants from their shape (8 distinct entries, positive
      # references, the even-n median identity) and because a blanked pool would
      # delete the worked example the 3.8 re-measurement has to reproduce.
      MLXFAST_QWEN_MTP_CONTRACT_PATH: fixtures/qwen3_8_27b_mtp_track.json
      # The BENCHMARK MANIFEST (editablePaths / scoring), distinct from the track
      # contract fixture above. Passed as CONTRACT_PATH to BOTH the static
      # review and overlay so a submission is judged and overlaid against the
      # SAME surface; naming a different file in one of the two silently drops
      # files the other accepted.
      MLXFAST_QWEN_MTP_EDITABLE_SURFACE_CONTRACT: benchmark.qwen-mtp.json
      # The manifest file names the pinned artifact in its three pinned header
      # lines (EigenLabs/Qwen3.8-27B-4bit @
      # eda45ab47f465d08d6558f0353a2346e2eb9d5b3) and now carries a GENERATED
      # PER-FILE BODY, produced from the published snapshot in the same commit
      # that resolved the revision.
      #
      # It was a header-only stub for exactly one commit. The 3.6 records the
      # cutover commit had retained were DELETED then rather than carried,
      # because 3.6 records checked against a 3.8 cache directory report every
      # file missing and read as a corrupt download rather than as an unfinished
      # pin; the shape pins carried a marker for that window so the failure
      # stayed first-minute and said what was actually wrong.
      MLXFAST_QWEN_MTP_TARGET_MANIFEST_PATH: fixtures/reference_qwen3_8_27b_4bit.sha256
      # Whole-manifest shape pins. They make a truncated or extended manifest a
      # first-minute failure instead of a silently smaller cache verification.
      #
      # SUMMED FROM THE MANIFEST BODY, never typed from a directory listing:
      # this pin is DEFINED as what the body sums to, which is why it could not
      # be written down before the body existed. Ten records, 15,153,237,117
      # bytes across three safetensors shards plus seven metadata files.
      # Previously "16" / "16081490064", the 3.6 backbone's shape.
      #
      # RECORD SCOPE, OPEN ITEM -- read the manifest's own header note. The
      # published repository carries an ELEVENTH file, Hugging Face's generated
      # `.gitattributes`, which the manifest does not pin. verify_cache below
      # rejects any file in the cache the manifest does not name, so box 3 must
      # stage the ten pinned files rather than a stock snapshot_download -- or
      # the record must be added and these two pins moved to 11 / 15153238687
      # with it.
      MLXFAST_QWEN_MTP_TARGET_MANIFEST_RECORDS: 10
      MLXFAST_QWEN_MTP_TARGET_MANIFEST_BYTES: 15153237117
      # The MTP head's byte manifest, regenerated from the published head in the
      # same commit. Built like the target manifest -- the LFS oid for the LFS
      # blob (model.safetensors), direct content hashing for the rest.
      MLXFAST_QWEN_MTP_HEAD_MANIFEST_PATH: fixtures/qwen3_8_27b_mtp_head.sha256
      # Whole-manifest shape pins for the head, summed from the checked-in file,
      # for exactly the reason the target's exist: per-file hashing cannot see a
      # manifest that LOST records -- it would verify fewer files and report
      # success.
      #
      # 2 records: the published head repo carries exactly two files and BOTH
      # are pinned, including `.gitattributes`. Omitting it is not an option --
      # verify_cache's flat inventory check rejects any cache file the manifest
      # does not name, and a stock snapshot_download stages it, so the earlier
      # 7-vs-8 shape on the 3.6 head failed the run wholesale (run 31665285024).
      # Pinning is the fix, not deleting from the cache.
      #
      # These were 8 records / 258490810 bytes, the 3.6 head's whole-tree shape.
      # The 3.8 head is still a smaller TREE despite much larger WEIGHTS: it
      # ships no tokenizer files, because the head merges into the target's tree
      # under the `mtp.` prefix at load. It does ship config.json and
      # model.safetensors.index.json, which verifyHeadTree requires -- that is
      # what took the tree from two records at 5419d386 to four at 26a328e0.
      MLXFAST_QWEN_MTP_HEAD_MANIFEST_RECORDS: 4
      MLXFAST_QWEN_MTP_HEAD_MANIFEST_BYTES: 849406438
      # --- Decode / score contract ---------------------------------------
      # THE OFFERED PER-ROUND DRAFT CEILING, not a schedule (contract change
      # 2026-08-14). It was 2, pinned from the MTP session's measured envelope
      # (1.74x @ 32, 1.34x @ 128, ~1.0x @ 512; depth 3 exact but net-slower)
      # and carrying a standing TODO to re-derive it across the whole pool.
      # Depth is competitive surface now, so the re-derivation moved to the
      # competitor and this value moved to the TRUSTED MAXIMUM: the parent
      # offers up to 8 drafts per round and the candidate picks its own count,
      # 0 through 8, per round.
      #
      # 8 == MLXFastConstants.qwenMTPMaxDraftDepth, and the two are pinned
      # equal by test. Raising this env alone would not widen anything: the
      # parent's own bound is the constant.
      #
      # AN UNMODIFIED TREE STILL DRAFTS 2. The shipped policy
      # (Qwen36MTPBlockSession.draftPolicy, editable) returns min(offer, 2), so
      # opening the ceiling does not silently re-tune the reference behaviour
      # the calibration was measured against.
      MLXFAST_QWEN_MTP_DEPTH: "8"
      MLXFAST_QWEN_MTP_DECODE_TOKENS: "512"
      MLXFAST_QWEN_MTP_CORRECTNESS_TOKENS: "512"
      # RE-ANCHORED 2026-08-14 (applied to the RAW median, the published score)
      # and set to 0.90 by operator decision the same day: "do not regress
      # serial by more than 10%".
      #
      # WHY NOT 0.95, WHICH IS THE FAMILY CONVENTION. Because at 0.95 this track
      # could not launch. Yukon's import dispatches a BASELINE RUN OF THE SOURCE
      # TREE and requires a published score to seed currentBestScore; no score
      # means the benchmark never opens and no submission can ever be made. The
      # stock tree medians ~0.935 raw -- it is a measured ~6.5% regression
      # against true serial decode at this window, which is precisely the fact
      # serial anchoring exists to stop hiding -- so a 0.95 floor rejects the
      # one run the whole track bootstraps from. The convention was carried over
      # from a NORMALISED score where an unmodified tree sat at 1.0 by
      # construction; it does not survive the change of anchor, and 0.90 is the
      # value that does.
      #
      # WHAT 0.90 MEANS. It is a regression bound, not a quality bar: a
      # submission may be slower than serial, and the leaderboard will say so,
      # but not by more than 10%. A candidate that genuinely cannot beat serial
      # should stop drafting and take 1.0 -- that is legal, costs nothing, and
      # is strictly better than publishing 0.92.
      #
      # CONSEQUENCES, so nobody has to rediscover them:
      #   * the stock tree PUBLISHES 0.935 and holds the board at -6.5%. The
      #     board's first number is a regression, on purpose.
      #   * calibration dispatches now publish normally -- there is no
      #     read-the-median-out-of-the-sealed-failure workaround any more.
      #   * k3-class regressions (~0.777) still floor-fail. That is the intended
      #     terminal state for a submission that is simply slower.
      MLXFAST_QWEN_MTP_DECODE_SPEEDUP_FLOOR: "0.90"
      # THE CEILING THE PUBLISHED NUMBER NEVER HAD (k-matrix finding 3). The box
      # wrapper bounds per-PAIR ratios at MAX_PLAUSIBLE_SPEEDUP and nothing
      # bounded the aggregate that reached the leaderboard, so an implausible
      # median could only be caught by a human reading it. The bound is
      # deliberately generous: the authors' own exact-greedy envelope tops out
      # at 1.74x at a 32-token window and kernel work on this tower has
      # historically bought tens of percent, so it leaves room for both
      # compounding and still calls anything above it a measurement fault.
      #
      # RAISED 3.0 -> 5.0 by operator decision 2026-08-17. The wrapper's
      # per-PAIR bound (MAX_PLAUSIBLE_SPEEDUP) moves 5.0 -> 8.0 in the same
      # decision so the aggregate ceiling stays strictly TIGHTER than the
      # per-pair bound and does not become vacuous at equality.
      MLXFAST_QWEN_MTP_DECODE_SPEEDUP_CEILING: "5.0"
      # WHAT AN UNMODIFIED TREE IS EXPECTED TO SCORE under the raw semantics.
      # SEEDED, NOT MEASURED-UNDER-THIS-CONTRACT: 0.9350424303 is the median of
      # the eight per-prompt RAW ratios of the k2 reference dispatch (a
      # comment-only editable diff over the installed baseline tree), recomputed
      # from that run's sealed per-prompt breakdown. The re-calibration runs that
      # replace it with a figure measured under these semantics happen
      # post-cutover, once the runner registers -- the procedure is in
      # docs/qwen-mtp-go-live-runbook.md and the value carries its provenance in
      # the contract fixture rather than being quietly treated as measured.
      MLXFAST_QWEN_MTP_CALIBRATION_EXPECTED_RAW_MEDIAN: "0.9940390645"
      MLXFAST_QWEN_MTP_CALIBRATION_BAND_PCT: "2.0"
      # PAIR BUDGET IS PER PROMPT (scoring semantics 2026-08-13). A ranked run
      # times all 8 pool prompts, so the run-level budget is
      # 8 x MLXFAST_QWEN_MTP_PAIRS_PER_PROMPT pairs = 16 timed phases at k=1.
      #
      # WHY k=1 AND NOT THE OLD 3/4. Those numbers bought pair-averaging on a
      # SINGLE prompt, where averaging was the only defence against pair noise.
      # The median over 8 prompts now does that job and more: it also cancels
      # the prompt lottery, which no amount of pair-averaging on one prompt
      # could. At the measured 0.77% pair noise, k=1 lands the score's own
      # dispersion near 0.34% -- better than the old 4-pair single-prompt shape
      # while timing 16 phases instead of 8. Raising this to 2 doubles the
      # timed work for a ~0.1pp improvement, so it is left at 1 and the flag is
      # there when calibration data says otherwise.
      MLXFAST_QWEN_MTP_PAIRS_PER_PROMPT: "1"
